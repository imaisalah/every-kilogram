<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asset gallery (dev)</title>
    <link rel="icon" href="data:," />
    <!--
      Dev check for the NASA assets: every model and planet on one sheet.
      tools/gallery.html?set=models | ?set=planets | ?set=variants | ?id=model-mro (one, large)
      Optional: &yaw=<radians> turns the models, &spin=1 animates, &sun=x,y,z moves the planets' Sun,
      &tilt=<radians> tips the planets towards the camera (to see a pole),
      &env=0 renders the models without a scene environment (tests the loader's fallback).
      window.galleryReady becomes true once everything has loaded (for tools/shot.mjs).
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #0b1420; color: #e9eef4; font: 13px/1.3 system-ui, sans-serif; }
      #view { position: fixed; inset: 0; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      .lab { position: absolute; padding: 6px 8px; }
      .lab b { display: block; font-size: 14px; }
      .lab span { opacity: 0.75; }
      .err { color: #ff8a7a; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="labels"></div>
    <script type="importmap">
      { "imports": { "three": "../vendor/three.module.js" } }
    </script>
    <script type="module">
      import { THREE, getRenderer, studioEnv } from '../js/3d/engine.js';
      import { MODELS } from '../js/3d/assetmanifest.js';
      import { model } from '../js/3d/loader.js';
      import { makePlanet, makeStars } from '../js/3d/assets.js';

      const q = new URLSearchParams(location.search);
      const set = q.get('set') || 'models';
      const yaw = Number(q.get('yaw') || 0.6);
      const spin = q.get('spin') === '1';
      const PLANETS = ['earth', 'moon', 'mars', 'venus', 'jupiter', 'europa'];
      const VARIANTS = [['mars', { map: 'mars-mola' }], ['venus', { map: 'venus-topo' }], ['venus', { clouds: false }], ['earth', { real: false }], ['moon', { real: false }], ['earth', { glow: false }]];
      let items;
      if (q.get('id')) items = [q.get('id')];
      else if (set === 'planets') items = PLANETS;
      else if (set === 'variants') items = VARIANTS;
      else items = Object.keys(MODELS);

      const r = getRenderer();
      const view = document.getElementById('view');
      view.appendChild(r.domElement);
      const env = await studioEnv();
      const cells = [];
      const labels = document.getElementById('labels');
      let pending = items.length;
      const done = () => --pending === 0 && setTimeout(() => (window.galleryReady = true), 600);

      for (const it of items) {
        const [key, opts] = Array.isArray(it) ? it : [it, {}];
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b1420);
        const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 1000);
        const lab = document.createElement('div');
        lab.className = 'lab';
        labels.appendChild(lab);
        const cell = { scene, camera, lab, obj: null };
        cells.push(cell);
        if (MODELS[key]) {
          if (q.get('env') !== '0') scene.environment = env;
          scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 0.6));
          const sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
          sun.position.set(3, 4, 5);
          scene.add(sun);
          camera.position.set(0, 0.55, 3.4);
          camera.lookAt(0, 0, 0);
          lab.innerHTML = `<b>${key}</b><span>loading…</span>`;
          model(key, { size: 2 })
            .then((m) => {
              m.rotation.y = yaw;
              scene.add(m);
              cell.obj = m;
              const u = m.userData;
              const s = u.size.toArray().map((x) => x.toFixed(2)).join(' × ');
              lab.innerHTML = `<b>${key}</b><span>${MODELS[key].title} · real ≈ ${u.realM} m · box ${s}</span>`;
            })
            .catch((e) => (lab.innerHTML = `<b>${key}</b><span class="err">${e.message}</span>`))
            .finally(done);
        } else {
          scene.background = new THREE.Color(0x02040a);
          scene.add(makeStars(1500, 400, 3));
          scene.add(new THREE.AmbientLight(0x6f8090, 0.12));
          const sun = new THREE.DirectionalLight(0xfff4e0, 3);
          sun.position.fromArray((q.get('sun') || '-4,1.2,2.6').split(',').map(Number));
          scene.add(sun);
          const p = makePlanet(key, 1, { segments: 128, res: 1024, ...opts });
          p.rotation.y = key === 'earth' ? -0.6 : 0.4;
          p.rotation.x = Number(q.get('tilt') || 0);
          scene.add(p);
          cell.obj = p;
          camera.position.set(0, 0, 3.6);
          lab.innerHTML = `<b>${key}</b><span>${JSON.stringify(opts)}</span>`;
          // Wait for the real maps (they swap in asynchronously).
          setTimeout(done, 2500);
        }
      }

      function frame(t) {
        const W = view.clientWidth;
        const H = view.clientHeight;
        r.setSize(W, H, false);
        r.setScissorTest(true);
        const n = cells.length;
        const cols = n === 1 ? 1 : W < 700 ? 2 : n <= 6 ? 3 : 4;
        const rows = Math.ceil(n / cols);
        const cw = Math.floor(W / cols);
        const ch = Math.floor(H / rows);
        cells.forEach((c, i) => {
          const x = (i % cols) * cw;
          const y = Math.floor(i / cols) * ch;
          r.setViewport(x, H - y - ch, cw, ch);
          r.setScissor(x, H - y - ch, cw, ch);
          c.camera.aspect = cw / ch;
          // Keep the subject in frame in tall (phone) cells.
          c.camera.zoom = Math.min(1, cw / ch);
          c.camera.updateProjectionMatrix();
          if (spin && c.obj) c.obj.rotation.y = yaw + t * 0.0003;
          r.render(c.scene, c.camera);
          c.lab.style.left = x + 'px';
          c.lab.style.top = y + 'px';
          c.lab.style.width = cw - 16 + 'px';
        });
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
