    <title>Last Light sets (dev)</title>
    <!-- Everything resolves from the game folder, exactly like index.html. -->
    <base href="../" />
    <!--
      Dev page for the Last Light art: the sets with the post pipeline and a
      free camera, and the character lineup. Not linked from the game.
        tools/ll-sets.html?set=pad|capsule|tunnel|habitat
          &cam=<anchor>            frame an anchor (from behind its facing, eye height)
          &cam=x,y,z,tx,ty,tz      exact camera position and target
          &fov=50                  field of view
          &post=0                  no post-processing (compare)
          &quality=low|high        force a tier (the game setting)
          &alarm=1  &power=0.3     set state
          &anchors=1               show every anchor with its name
          &t=<s>                   run the set this many seconds before the shot
          &hud=0                   hide the stats
        tools/ll-sets.html?view=chars    the character lineup (idle, walk, run, float, reach, wave, sit)
          &anim=<name>             everyone does one animation
          &cam=close|face          closer camera
          &n=<count>               how many characters
      Free camera: drag to look, WASD to fly, Q/E down/up, Shift faster, wheel = speed.
      window.LL has { engine, THREE, set, scene, camera, post(), stats(), frame(name|spec) }.
      window.testReady becomes true once the view has rendered.
    -->
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
      #app { display: none; }
      .ll-view { position: fixed; inset: 0; background: #05070a; }
      .ll-hud { position: fixed; inset-inline-start: 10px; top: 8px; font: 600 12px/1.35 Archivo, system-ui, sans-serif; color: #dfe6ee; background: rgba(5, 8, 12, 0.6); padding: 6px 9px; border-radius: 4px; white-space: pre; pointer-events: none; z-index: 3; }
      .ll-labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; font: 600 11px Archivo, system-ui, sans-serif; color: #fff; }
      .ll-labels span { position: absolute; transform: translate(-50%, -100%); background: rgba(10, 60, 90, 0.75); padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
    </style>
  </head>
